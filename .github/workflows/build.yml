name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners carry the Android SDK (ANDROID_HOME).
      - run: ./gradlew build
